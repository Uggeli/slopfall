<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DFSim — model viewer (M2)</title>
<style>
  html, body { margin: 0; height: 100%; background: #11141a; color: #cdd6e4; font: 13px/1.5 monospace; overflow: hidden; }
  #panel { position: absolute; top: 10px; left: 10px; background: rgba(20,24,32,.88); border: 1px solid #2c3444;
           border-radius: 6px; padding: 10px 12px; max-width: 280px; z-index: 10; }
  #panel h1 { font-size: 13px; margin: 0 0 6px; color: #9fd0ff; }
  #panel label { display: block; margin: 2px 0; cursor: pointer; }
  #panel input[type=text] { width: 90px; background: #0c0f14; color: #cdd6e4; border: 1px solid #2c3444; padding: 2px 4px; }
  #panel button { background: #24405e; color: #cfe6ff; border: 1px solid #3a587a; border-radius: 4px; padding: 2px 8px; cursor: pointer; }
  #stat { margin-top: 8px; color: #8893a7; white-space: pre-wrap; }
  #combo { margin-top: 6px; color: #ffd479; }
  a { color: #9fd0ff; }
</style>
</head>
<body>
<div id="panel">
  <h1>DFSim model viewer · M2</h1>
  <div>model <input id="mid" type="text" value="44005"> <button id="load">load</button></div>
  <label><input type="checkbox" id="flipv"> flip texture V</label>
  <label><input type="checkbox" id="mirx"> mirror X</label>
  <label><input type="checkbox" id="mirz"> mirror Z</label>
  <label><input type="checkbox" id="wire"> wireframe</label>
  <label><input type="checkbox" id="single"> single-sided (cull backfaces)</label>
  <label><input type="checkbox" id="axes" checked> show grid/axes</label>
  <div id="combo"></div>
  <div id="stat">loading…</div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(devicePixelRatio);
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x11141a);

const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.01, 1000);
camera.position.set(4, 4, 6);
const controls = new OrbitControls(camera, renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff, 0.7));
const sun = new THREE.DirectionalLight(0xffffff, 1.4);
sun.position.set(5, 10, 7);
scene.add(sun);

const helpers = new THREE.Group();
const grid = new THREE.GridHelper(20, 20, 0x335577, 0x223344);
helpers.add(grid);
helpers.add(new THREE.AxesHelper(2));   // X red, Y green, Z blue
scene.add(helpers);

// Surface texture/resource load failures (we can't see them otherwise).
const manager = new THREE.LoadingManager();
manager.onError = (url) => { ui('stat').textContent = 'FAILED to load:\n' + url; console.error('load error', url); };
const loader = new GLTFLoader(manager);
// Our texture URIs are site-absolute ("/asset/texture/.."); without this,
// GLTFLoader resolves them relative to the model URL and 404s.
loader.setResourcePath(location.origin + '/');
let root = null;          // current model group
let textures = [];        // loaded textures (for flipY toggling)

const ui = id => document.getElementById(id);
const stat = (s) => ui('stat').textContent = s;

function loadModel(id) {
  stat('loading model ' + id + ' …');
  loader.load('/asset/model/' + id,
    (gltf) => {
      if (root) scene.remove(root);
      root = gltf.scene;
      textures = [];
      let verts = 0, tris = 0, prims = 0;
      root.traverse(o => {
        if (!o.isMesh) return;
        prims++;
        const g = o.geometry;
        if (g.attributes.position) verts += g.attributes.position.count;
        if (g.index) tris += g.index.count / 3;
        const mats = Array.isArray(o.material) ? o.material : [o.material];
        for (const m of mats) {
          if (m.map) {
            m.map.magFilter = THREE.NearestFilter;   // pixel-art textures
            m.map.minFilter = THREE.NearestFilter;
            m.map.generateMipmaps = false;
            m.map.needsUpdate = true;
            textures.push(m.map);
          }
        }
      });
      scene.add(root);
      applyOrientation();
      frameCamera();
      stat(`model ${id}\nprimitives ${prims}\nvertices ${verts}\ntriangles ${tris}`);
    },
    undefined,
    (err) => { stat('load failed: ' + (err?.message || err) + '\n(no such model id?)'); console.error(err); }
  );
}

function applyOrientation() {
  if (!root) return;
  root.scale.set(ui('mirx').checked ? -1 : 1, 1, ui('mirz').checked ? -1 : 1);
  for (const t of textures) { t.flipY = ui('flipv').checked; t.needsUpdate = true; }
  root.traverse(o => {
    if (!o.isMesh) return;
    const mats = Array.isArray(o.material) ? o.material : [o.material];
    for (const m of mats) {
      m.wireframe = ui('wire').checked;
      m.side = ui('single').checked ? THREE.FrontSide : THREE.DoubleSide;
      m.needsUpdate = true;
    }
  });
  helpers.visible = ui('axes').checked;
  ui('combo').textContent = 'combo: ' +
    (ui('flipv').checked ? 'flipV ' : '') +
    (ui('mirx').checked ? 'mirrorX ' : '') +
    (ui('mirz').checked ? 'mirrorZ ' : '') +
    (ui('single').checked ? 'single-sided ' : 'double-sided ') +
    (ui('wire').checked ? 'wire' : '') || 'combo: (defaults)';
}

function frameCamera() {
  if (!root) return;
  const box = new THREE.Box3().setFromObject(root);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  const r = Math.max(size.x, size.y, size.z) || 1;
  controls.target.copy(center);
  camera.position.set(center.x + r * 1.4, center.y + r * 1.1, center.z + r * 1.8);
  camera.near = r / 100; camera.far = r * 100; camera.updateProjectionMatrix();
  controls.update();
}

for (const id of ['flipv', 'mirx', 'mirz', 'wire', 'single', 'axes'])
  ui(id).addEventListener('change', applyOrientation);
ui('load').addEventListener('click', () => loadModel(ui('mid').value.trim()));

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

(function animate() { requestAnimationFrame(animate); controls.update(); renderer.render(scene, camera); })();

const start = new URLSearchParams(location.search).get('model');
if (start) ui('mid').value = start;
loadModel(ui('mid').value);
</script>
</body>
</html>
