<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DFSim — town viewer (M3a)</title>
<style>
  html, body { margin: 0; height: 100%; background: #0e1117; color: #cdd6e4; font: 13px/1.5 monospace; overflow: hidden; }
  #panel { position: absolute; top: 10px; left: 10px; background: rgba(20,24,32,.88); border: 1px solid #2c3444;
           border-radius: 6px; padding: 10px 12px; max-width: 300px; z-index: 10; }
  #panel h1 { font-size: 13px; margin: 0 0 6px; color: #9fd0ff; }
  #panel label { display: block; margin: 2px 0; cursor: pointer; }
  #stat { margin-top: 6px; color: #8893a7; white-space: pre-wrap; }
</style>
</head>
<body>
<div id="panel">
  <h1>DFSim town viewer · M3a</h1>
  <label><input type="checkbox" id="mirx"> mirror X (handedness)</label>
  <label><input type="checkbox" id="mirz"> mirror Z</label>
  <label><input type="checkbox" id="wire"> wireframe</label>
  <label><input type="checkbox" id="grid" checked> grid</label>
  <label><input type="checkbox" id="terr" checked> terrain</label>
  <div id="clock" style="margin-top:6px;color:#ffd479">--:-- · —</div>
  <div id="speed" style="margin-top:6px">speed
    <button data-s="0">⏸</button><button data-s="1">1×</button><button data-s="4">4×</button>
    <button data-s="12">12×</button><button data-s="60">60×</button>
  </div>
  <div id="stat">loading…</div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const ui = id => document.getElementById(id);
const stat = s => ui('stat').textContent = s;

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(devicePixelRatio);
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9fc0e8);
scene.fog = new THREE.Fog(0x9fc0e8, 400, 1600);   // hides the 3x3 terrain edge too
const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 10000);
const controls = new OrbitControls(camera, renderer.domElement);

const ambient = new THREE.AmbientLight(0xffffff, 0.6);
scene.add(ambient);
const sun = new THREE.DirectionalLight(0xffffff, 1.2);
sun.position.set(0.5, 1, 0.4);
scene.add(sun);

const grid = new THREE.GridHelper(2000, 200, 0x335577, 0x1c2738);
scene.add(grid);

const town = new THREE.Group();    // all building instances
scene.add(town);

let terrainTiles = null;        // array of tile data (centre + neighbours)
let terrainMat = null;          // shared ground-atlas material
const texLoader = new THREE.TextureLoader();
const terrainGroup = new THREE.Group();
scene.add(terrainGroup);

// Build a per-cell textured terrain mesh: heightfield (129x129) + a 128x128
// tilemap that picks a ground-tile (record + rotate/flip) per cell from the
// ground atlas (8x7, 64px tiles). Tile UV frame baked below (see luv).
const ATLAS_COLS = 8, ATLAS_ROWS = 7;

function ensureTerrainMat(archive) {
  if (terrainMat) return terrainMat;
  terrainMat = new THREE.MeshLambertMaterial({ color: 0x8a8a8a });
  texLoader.load(`/asset/groundatlas/${archive}`, t => {
    t.flipY = false;   // atlas is top-down; UV v=0 at top
    t.magFilter = THREE.NearestFilter; t.minFilter = THREE.NearestFilter; t.generateMipmaps = false;
    terrainMat.map = t; terrainMat.color.set(0xffffff); terrainMat.needsUpdate = true;
  });
  return terrainMat;
}

// Rebuild all tile meshes (centre + neighbours) into terrainGroup.
function buildTerrain(tiles) {
  while (terrainGroup.children.length) { const m = terrainGroup.children.pop(); m.geometry.dispose(); }
  for (const d of tiles) {
    const m = buildTileMesh(d);
    m.position.set(d.originX, 0, d.originZ);
    terrainGroup.add(m);
  }
  positionTerrain();
}

function buildTileMesh(d) {
  const dim = d.dim, step = d.worldSize / (dim - 1), td = d.tileDim;
  // byte[] arrives as base64 from System.Text.Json; decode to bytes.
  const tilemap = Uint8Array.from(atob(d.tilemap), c => c.charCodeAt(0));
  const H = (gx, gy) => d.heights[Math.min(dim - 1, Math.max(0, gx)) * dim + Math.min(dim - 1, Math.max(0, gy))];
  const wx = gx => gx * step;
  const wz = gy => gy * step;
  // Smooth normal per heightfield grid point (central differences).
  const N = (gx, gy) => {
    const nx = H(gx - 1, gy) - H(gx + 1, gy), nz = H(gx, gy - 1) - H(gx, gy + 1);
    const v = new THREE.Vector3(nx, 2 * step, nz); v.normalize(); return v;
  };

  const cells = (td) * (td), pos = new Float32Array(cells * 4 * 3),
        nor = new Float32Array(cells * 4 * 3), uv = new Float32Array(cells * 4 * 2);
  const idx = new Uint32Array(cells * 6);
  const eps = 0.5 / (ATLAS_COLS * 64);   // half-texel inset
  let vp = 0, up = 0, ip = 0, vbase = 0;

  for (let cx = 0; cx < td; cx++) {
    for (let cy = 0; cy < td; cy++) {
      const tile = tilemap[cx * td + cy];
      const rec = tile & 63, rot = (tile & 64) !== 0, flip = (tile & 128) !== 0;
      const col = rec % ATLAS_COLS, row = (rec / ATLAS_COLS) | 0;
      const u0 = col / ATLAS_COLS + eps, u1 = (col + 1) / ATLAS_COLS - eps;
      const v0 = row / ATLAS_ROWS + eps, v1 = (row + 1) / ATLAS_ROWS - eps;
      // tile-local UV per quad corner [ (cx,cy),(cx+1,cy),(cx,cy+1),(cx+1,cy+1) ].
      // Baked (M3b, verified in-browser): (u,v)->(1-v,u) = transpose + mirror-U
      // aligns DF ground-tile art to our cell frame; then per-tile flip (180°,
      // ImageProcessing.FlipColors) + rotate (90°, RotateColors) from the tilemap byte.
      let luv = [[0, 0], [1, 0], [0, 1], [1, 1]].map(([u, v]) => [1 - v, u]);
      const xf = (p) => { let [u, v] = p; if (flip) { u = 1 - u; v = 1 - v; } if (rot) { const t = u; u = v; v = 1 - t; } return [u, v]; };
      luv = luv.map(xf);

      const corners = [[cx, cy], [cx + 1, cy], [cx, cy + 1], [cx + 1, cy + 1]];
      for (let k = 0; k < 4; k++) {
        const [gx, gy] = corners[k];
        pos[vp++] = wx(gx); pos[vp++] = H(gx, gy); pos[vp++] = wz(gy);
        const n = N(gx, gy); nor[vp - 3] = n.x; nor[vp - 2] = n.y; nor[vp - 1] = n.z;
        uv[up++] = u0 + luv[k][0] * (u1 - u0);
        uv[up++] = v0 + luv[k][1] * (v1 - v0);
      }
      // two triangles (CCW up-facing): 0,3,1  0,2,3
      idx[ip++] = vbase; idx[ip++] = vbase + 3; idx[ip++] = vbase + 1;
      idx[ip++] = vbase; idx[ip++] = vbase + 2; idx[ip++] = vbase + 3;
      vbase += 4;
    }
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('normal', new THREE.BufferAttribute(nor, 3));
  geo.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
  geo.setIndex(new THREE.BufferAttribute(idx, 1));

  return new THREE.Mesh(geo, ensureTerrainMat(d.groundArchive));
}

function positionTerrain() {
  terrainGroup.visible = ui('terr').checked;
}

const manager = new THREE.LoadingManager();
manager.onError = url => console.warn('load error', url);
const loader = new GLTFLoader(manager);
loader.setResourcePath(location.origin + '/');   // resolve /asset/texture URLs

function applyNearest(root) {
  root.traverse(o => {
    if (!o.isMesh) return;
    const mats = Array.isArray(o.material) ? o.material : [o.material];
    for (const m of mats) if (m.map) {
      m.map.magFilter = THREE.NearestFilter;
      m.map.minFilter = THREE.NearestFilter;
      m.map.generateMipmaps = false;
      m.map.needsUpdate = true;
    }
  });
}

function loadModel(id, climate, season) {
  return new Promise(res => {
    loader.load(`/asset/model/${id}?climate=${climate}&season=${season}`,
      gltf => { applyNearest(gltf.scene); res(gltf.scene); },
      undefined,
      () => res(null));   // missing model -> skip its instances
  });
}

function frame(min, max) {
  const cx = (min[0] + max[0]) / 2, cz = (min[2] + max[2]) / 2;
  const r = Math.max(max[0] - min[0], max[2] - min[2], 20);
  controls.target.set(cx, 0, cz);
  camera.position.set(cx + r * 0.55, r * 0.7, cz + r * 0.95);
  camera.far = r * 20; camera.updateProjectionMatrix();
  controls.update();
}

function applyToggles() {
  town.scale.set(ui('mirx').checked ? -1 : 1, 1, ui('mirz').checked ? -1 : 1);
  town.traverse(o => {
    if (!o.isMesh) return;
    const mats = Array.isArray(o.material) ? o.material : [o.material];
    for (const m of mats) { m.wireframe = ui('wire').checked; m.needsUpdate = true; }
  });
  grid.visible = ui('grid').checked;
}
for (const id of ['mirx', 'mirz', 'wire', 'grid']) ui(id).addEventListener('change', applyToggles);
ui('terr').addEventListener('change', () => positionTerrain());

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
let lastFrame = performance.now() / 1000;
function animate() {
  requestAnimationFrame(animate);
  const now = performance.now() / 1000;
  const dt = Math.min(0.1, now - lastFrame); lastFrame = now;
  controls.update();
  updateAtmosphere(dt);
  if (civilianArchives && curSnap.size) updateAgents(now);
  renderer.render(scene, camera);
}

// ---- M5a: day/night sky, sun arc, weather tint, fog ----
const world = { hour: 12, minute: 0, night: false, sun: 1, weather: 'Sunny' };
const SKY_DAY = new THREE.Color(0x9fc0e8), SKY_NIGHT = new THREE.Color(0x10141f);
const SKY_DUSK = new THREE.Color(0xd98a4a);   // dawn/dusk warm
const tmpA = new THREE.Color(), tmpB = new THREE.Color();

// Weather → (sky desaturation toward grey, sun scale, fog tightness).
function weatherMods(w) {
  switch (w) {
    case 'Cloudy':   return { grey: 0.35, sun: 0.7, fog: 1.0 };
    case 'Overcast': return { grey: 0.6,  sun: 0.45, fog: 0.8 };
    case 'Fog':      return { grey: 0.5,  sun: 0.5, fog: 0.35 };
    case 'Rain':     return { grey: 0.7,  sun: 0.35, fog: 0.6 };
    case 'Thunder':  return { grey: 0.8,  sun: 0.25, fog: 0.5 };
    case 'Snow':     return { grey: 0.55, sun: 0.6, fog: 0.55, white: true };
    default:         return { grey: 0.0,  sun: 1.0, fog: 1.0 };   // Sunny
  }
}

function updateAtmosphere(dt) {
  // dawn/dusk weighting: peaks near 6:00 and 18:00
  const h = world.hour + world.minute / 60;
  const twilight = Math.max(0, 1 - Math.min(Math.abs(h - 6), Math.abs(h - 18)) / 2.5);
  const sun01 = Math.max(0, Math.min(1, world.sun));
  const wm = weatherMods(world.weather);

  // target sky: night→day by daylight, warm push at twilight, grey by weather
  tmpA.copy(SKY_NIGHT).lerp(SKY_DAY, sun01);
  tmpA.lerp(SKY_DUSK, twilight * 0.6 * sun01);
  tmpB.setRGB((tmpA.r + tmpA.g + tmpA.b) / 3, (tmpA.r + tmpA.g + tmpA.b) / 3, (tmpA.r + tmpA.g + tmpA.b) / 3);
  if (wm.white) tmpB.setRGB(0.85, 0.87, 0.9);
  tmpA.lerp(tmpB, wm.grey);

  const k = 1 - Math.pow(0.001, dt);   // ~frame-rate-independent smoothing
  scene.background.lerp(tmpA, k);
  scene.fog.color.copy(scene.background);
  scene.fog.far = 1600 * wm.fog;
  scene.fog.near = scene.fog.far * 0.25;

  // sun light: arc by hour (east→west), intensity by daylight*weather, warm at twilight
  const az = (h / 24) * Math.PI * 2 - Math.PI / 2;   // rough azimuth
  const pitch = Math.max(0.05, sun01);
  sun.position.set(Math.cos(az), pitch * 1.2 + 0.15, Math.sin(az));
  const sunTargetI = sun01 * wm.sun * 1.4;
  sun.intensity += (sunTargetI - sun.intensity) * k;
  tmpB.setRGB(1, 1 - twilight * 0.35, 1 - twilight * 0.55);   // warm at dawn/dusk
  sun.color.lerp(tmpB, k);
  const ambTarget = 0.25 + sun01 * 0.45 * (1 - wm.grey * 0.4);
  ambient.intensity += (ambTarget - ambient.intensity) * k;

  // HUD clock
  ui('clock').textContent = `${String(world.hour).padStart(2,'0')}:${String(world.minute).padStart(2,'0')} · ${world.weather}`;
}

// ---- Live agents (M4a): the sim's people as animated sprite billboards ----
const agents = new THREE.Group();
scene.add(agents);
let civilianArchives = null;
const sheets = new Map();          // archive -> { tex, meta, mat, sheetW, sheetH } | 'loading'
const people = new Map();          // entityId -> { mesh, archive }
let prevSnap = new Map(), curSnap = new Map();   // id -> [x,z,yaw]
let prevTime = 0, curTime = 0;
const SNAP_INTERVAL = 0.2;         // fallback gap; web pump publishes ~5 Hz
const WALK_FPS = 4;
// 8-direction -> (record, flip): records 0-4 = facing S/SW/W/NW/N; NE/E/SE reuse
// records 3/2/1 mirrored (DFU MobilePersonBillboard). Idle = record 5.
const ORI_RECORD = [0, 1, 2, 3, 4, 3, 2, 1];
const ORI_FLIP   = [false, false, false, false, false, true, true, true];
const DIR_SIGN = 1;   // verified: maps walk direction to the correct facing sprite

function hash32(n) { n = (n ^ 61) ^ (n >>> 16); n = (n + (n << 3)) | 0; n ^= n >>> 4; n = Math.imul(n, 0x27d4eb2d); n ^= n >>> 15; return n >>> 0; }

function getSheet(archive) {
  let s = sheets.get(archive);
  if (s) return s === 'loading' ? null : s;
  sheets.set(archive, 'loading');
  Promise.all([
    fetch(`/asset/spritemeta/${archive}`).then(r => r.json()),
    new Promise(res => texLoader.load(`/asset/spritesheet/${archive}`, res)),
  ]).then(([meta, tex]) => {
    tex.flipY = false; tex.magFilter = THREE.NearestFilter; tex.minFilter = THREE.NearestFilter; tex.generateMipmaps = false;
    const mat = new THREE.MeshBasicMaterial({ map: tex, alphaTest: 0.5, side: THREE.DoubleSide });
    sheets.set(archive, { tex, meta, mat, sheetW: meta.cols * meta.cellW, sheetH: meta.rows * meta.cellH });
  }).catch(() => sheets.delete(archive));
  return null;
}

// Set a plane's UVs to a sheet cell (record row, frame col); optional horizontal flip.
function setCellUV(geo, s, record, frame, flip) {
  const m = s.meta;
  const uL = (frame * m.cellW) / s.sheetW, uR = ((frame + 1) * m.cellW) / s.sheetW;
  const vT = (record * m.cellH) / s.sheetH, vB = ((record + 1) * m.cellH) / s.sheetH;  // flipY=false: v=0 top
  const a = flip ? uR : uL, b = flip ? uL : uR;
  const uv = geo.attributes.uv;
  uv.setXY(0, a, vT); uv.setXY(1, b, vT); uv.setXY(2, a, vB); uv.setXY(3, b, vB);
  uv.needsUpdate = true;
}

function updateAgents(t) {
  // Interpolate prev->cur over the ACTUAL snapshot gap (the web pump runs ~5 Hz,
  // not the 10 tps tick rate), so movement glides instead of teleport-then-freeze.
  const interval = (curTime - prevTime) || SNAP_INTERVAL;
  const alpha = curTime ? Math.min(1, (t - curTime) / interval) : 0;
  const walkFrame = Math.floor(t * WALK_FPS);
  const seen = new Set();

  for (const [id, c] of curSnap) {
    seen.add(id);
    const archive = civilianArchives[hash32(id) % civilianArchives.length];
    const s = getSheet(archive);
    if (!s) continue;

    let p = people.get(id);
    if (!p || p.archive !== archive) {
      if (p) agents.remove(p.mesh);
      const geo = new THREE.PlaneGeometry(s.meta.worldW, s.meta.worldH);
      const mesh = new THREE.Mesh(geo, s.mat);
      agents.add(mesh);
      p = { mesh, archive, geo };
      people.set(id, p);
    }

    // interpolate position prev->cur
    const pr = prevSnap.get(id) || c;
    const x = pr[0] + (c[0] - pr[0]) * alpha, z = pr[1] + (c[1] - pr[1]) * alpha;
    p.mesh.position.set(x, s.meta.worldH / 2, z);
    p.mesh.lookAt(camera.position.x, s.meta.worldH / 2, camera.position.z);   // upright billboard

    // Facing from actual movement (cur-prev); idle sprite when stationary.
    const mvx = c[0] - pr[0], mvz = c[1] - pr[1];
    const speed = Math.hypot(mvx, mvz);
    let record, flip;
    if (speed < 0.05) {            // standing → idle record 5 (or last row)
      record = Math.min(5, s.meta.rows - 1); flip = false;
    } else {
      const fl = 1 / speed, fx = mvx * fl, fz = mvz * fl;       // forward (walk dir)
      let dx = camera.position.x - x, dz = camera.position.z - z;
      const dl = Math.hypot(dx, dz) || 1; dx /= dl; dz /= dl;   // dir to camera
      const dot = dx * fx + dz * fz, cross = dx * fz - dz * fx;
      let ori = Math.round(DIR_SIGN * Math.atan2(cross, dot) / (Math.PI / 4));
      ori = ((ori % 8) + 8) % 8;
      record = ORI_RECORD[ori]; flip = ORI_FLIP[ori];
    }
    const fc = s.meta.frames[record] || 1;
    setCellUV(p.geo, s, record, walkFrame % fc, flip);
  }

  for (const [id, p] of people) if (!seen.has(id)) { agents.remove(p.mesh); p.geo.dispose(); people.delete(id); }
}

function onSnap(msg) {
  prevSnap = curSnap; prevTime = curTime;
  curSnap = new Map(msg.entities.map(e => [e[0], [e[1], e[2], e[5]]]));   // id -> [x,z,yaw]
  curTime = performance.now() / 1000;
  world.hour = msg.hour; world.minute = msg.minute; world.night = msg.night;
  world.sun = msg.sun; world.weather = msg.weather;
  stat(`live · ${curSnap.size} agents · ${String(msg.hour).padStart(2,'0')}:${String(msg.minute).padStart(2,'0')} · ${msg.weather}`);
}

let agentWs = null;
function connectAgents() {
  stat('agents: connecting…');
  agentWs = new WebSocket(`ws://${location.host}/ws`);
  agentWs.onopen = () => { stat('agents: stream open, waiting…'); setSpeed(1); };
  agentWs.onerror = () => stat('agents: WebSocket error');
  agentWs.onmessage = (ev) => {
    const msg = JSON.parse(ev.data);
    if (msg.type === 'snap') onSnap(msg);   // ignore the 'world' frame; we have /asset/town
  };
  agentWs.onclose = () => { stat('agents: stream closed, retrying…'); setTimeout(connectAgents, 1000); };
}

function setSpeed(scale) {
  if (agentWs && agentWs.readyState === 1)
    agentWs.send(JSON.stringify({ type: 'speed', scale }));
  document.querySelectorAll('#speed button').forEach(b =>
    b.style.color = Number(b.dataset.s) === scale ? '#9fd0ff' : '#8893a7');
}

// Speed control → SetTimeScaleInput (server handles {type:"speed",scale}). 1× ≈
// real-time walking (1.4 m/s); higher to watch the day cycle.
document.querySelectorAll('#speed button').forEach(btn => {
  btn.addEventListener('click', () => setSpeed(Number(btn.dataset.s)));
});

async function init() {
  stat('fetching town layout…');
  // no-store: these aggregate payloads change as the renderer evolves; the
  // per-asset model/texture/atlas endpoints stay cacheable (immutable).
  const data = await (await fetch('/asset/town', { cache: 'no-store' })).json();
  const climate = data.climateBase, season = data.season;

  // Terrain first, so buildings visibly sit on it.
  try {
    terrainTiles = await (await fetch('/asset/terrain', { cache: 'no-store' })).json();
    buildTerrain(terrainTiles);
  } catch (e) { console.warn('terrain load failed', e); }

  stat(`loading ${data.modelIds.length} unique models…`);

  const protos = new Map();
  let loaded = 0;
  await Promise.all(data.modelIds.map(async id => {
    protos.set(id, await loadModel(id, climate, season));
    stat(`loading models ${++loaded}/${data.modelIds.length}…`);
  }));

  let placed = 0;
  for (const p of data.placements) {
    const proto = protos.get(p.modelId);
    if (!proto) continue;
    const inst = proto.clone();
    inst.applyMatrix4(new THREE.Matrix4().fromArray(p.matrix));
    town.add(inst);
    placed++;
  }
  applyToggles();
  frame(data.min, data.max);

  const climates = ['Desert', 'Mountain', 'Temperate', 'Swamp'];
  stat(`${data.region} · ${data.location}\nclimate: ${climates[climate] ?? climate}\nplacements: ${placed}/${data.placements.length}\nunique models: ${data.modelIds.length}\nconnecting agents…`);

  // Live agents: the civilian sprite set, then the snapshot stream.
  civilianArchives = await (await fetch('/asset/civilians')).json();
  connectAgents();
}
init().catch(e => { stat('error: ' + (e?.message || e)); console.error(e); });
animate();   // start the render loop after all declarations are initialised
</script>
</body>
</html>
