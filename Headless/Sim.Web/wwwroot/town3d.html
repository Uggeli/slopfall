<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DFSim — town viewer</title>
<style>
  html, body { margin: 0; height: 100%; background: #0e1117; color: #cdd6e4; font: 13px/1.5 monospace; overflow: hidden; }
  #panel { position: absolute; top: 10px; left: 10px; background: rgba(20,24,32,.88); border: 1px solid #2c3444;
           border-radius: 6px; padding: 10px 12px; max-width: 300px; z-index: 10; }
  #panel h1 { font-size: 13px; margin: 0 0 6px; color: #9fd0ff; }
  #panel label { display: block; margin: 2px 0; cursor: pointer; }
  #gfx { margin-top: 6px; border-top: 1px solid #2c3444; padding-top: 6px; }
  #gfx .ghead { color: #9fd0ff; margin-bottom: 2px; }
  #gfx label { display: flex; align-items: center; gap: 6px; }
  #gfx input[type=range] { flex: 1; min-width: 0; accent-color: #9fd0ff; }
  #gfx .gval { color: #ffd479; min-width: 42px; text-align: right; }
  #stat { margin-top: 6px; color: #8893a7; white-space: pre-wrap; }
  #detail { position: absolute; top: 10px; right: 10px; width: 260px; max-height: 82vh; overflow: auto; z-index: 10; display: none;
            background: rgba(20,24,32,.9); border: 1px solid #2c3444; border-radius: 6px; padding: 10px 12px; }
  #detail .dh { color: #9fd0ff; font-weight: bold; margin-bottom: 3px; }
  #detail .dx { float: right; color: #6b768a; cursor: pointer; font-weight: normal; }
  #detail .dim { color: #8893a7; }
  #detail .ndh { color: #9fd0ff; margin: 7px 0 3px; }
  #detail .nb { display: flex; align-items: center; gap: 6px; margin: 1px 0; }
  #detail .nb > span:first-child { width: 64px; }
  #detail .nbar { flex: 1; height: 8px; background: #20262f; border-radius: 3px; overflow: hidden; }
  #detail .nbar > i { display: block; height: 100%; }
  #detail .dlink { color: #9fd0ff; cursor: pointer; text-decoration: underline; }
  #detail .tabs { display: flex; gap: 4px; margin: 4px 0 6px; }
  #detail .tab { padding: 1px 8px; border: 1px solid #2c3444; border-radius: 4px; color: #8893a7; cursor: pointer; }
  #detail .tab.active { color: #0e1117; background: #9fd0ff; border-color: #9fd0ff; }
  #detail .odd { font-size: 12px; }
  #detail .tnode { white-space: nowrap; display: flex; justify-content: space-between; gap: 8px; padding: 1px 0; }
  #detail .tnode.chosen { color: #ffd479; }
  #detail .tnode .sc { color: #6b768a; }
  #detail .tcaret { cursor: pointer; color: #9fd0ff; }
  #detail .role { color: #6b768a; }
</style>
</head>
<body>
<div id="panel">
  <h1>DFSim town viewer · M3a</h1>
  <label><input type="checkbox" id="mirx"> mirror X (handedness)</label>
  <label><input type="checkbox" id="mirz"> mirror Z</label>
  <label><input type="checkbox" id="wire"> wireframe</label>
  <label><input type="checkbox" id="grid" checked> grid</label>
  <label><input type="checkbox" id="terr" checked> terrain</label>
  <div id="gfx">
    <div class="ghead">graphics</div>
    <label><input type="checkbox" id="fogOn" checked> fog</label>
    <label>distance <span id="fogVal" class="gval"></span><input type="range" id="fog" min="200" max="8000" step="100"></label>
    <label>brightness <span id="brightVal" class="gval"></span><input type="range" id="bright" min="0" max="200" value="100"></label>
    <label>field of view <span id="fovVal" class="gval"></span><input type="range" id="fov" min="35" max="100" value="60"></label>
    <label>resolution <span id="resVal" class="gval"></span><input type="range" id="res" min="50" max="100" value="100"></label>
  </div>
  <div style="margin-top:4px;color:#6b768a">WASD move · E/Q up/down · Shift fast · drag orbit · click a person</div>
  <div id="clock" style="margin-top:6px;color:#ffd479">--:-- · —</div>
  <div id="speed" style="margin-top:6px">tick rate
    <button data-s="0">⏸</button><button data-s="10">10</button><button data-s="30">30</button>
    <button data-s="60">60</button><button data-s="-1">MAX</button>
  </div>
  <div id="stat">loading…</div>
</div>
<div id="detail"></div>
<!-- Communication log: a minimal scrolling feed of agent utterances from the snapshot
     stream (P4). Structure only — atom ids resolved to names via /asset/atoms. -->
<div id="commlog" style="position:fixed;right:8px;bottom:8px;width:330px;max-height:34vh;
  overflow-y:auto;background:rgba(12,16,24,.82);color:#cdd6e6;font:11px/1.45 monospace;
  padding:6px 8px;border:1px solid #2a3344;border-radius:4px;z-index:5">
  <div style="color:#7f8aa0;margin-bottom:3px">comms</div>
  <div id="commlines"></div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>

<script type="module">
import * as THREE from 'three';
import { createNet } from './net/client.js';
import { scene, world, gfx } from './engine/scene.js';
import { createEngine } from './engine/index.js';
import { loadModel } from './engine/assets.js';
import { town, setTownClimateSeason, setGatePairs, getFlatSheet, buildFlatInstances } from './engine/world.js';
import { buildTerrain, getRegionMeta, setRegionMeta } from './engine/terrain.js';
import { setSpritePools } from './engine/agents.js';
import { pushUtterances } from './ui/comms.js';
import { stat } from './ui/hud.js';
import { createObserver } from './modes/observer.js';

// ---- Live agents (M4a): sprite billboards + per-frame interp → engine/agents.js ----
let flats = null;   // THREE.Group of flat billboards; populated by init(), billboarded each frame

// App-side reactions to a decoded snapshot (net owns the buffer + decode).
function onSnapshot(msg) {
  if (msg.utterances) pushUtterances(msg.utterances);
  world.hour = msg.hour; world.minute = msg.minute; world.night = msg.night;
  world.sun = msg.sun; world.weather = msg.weather;
  observer.maybeCapture(msg.tick);   // capture mode: pose + pause at CAP_TICK (test infra)
  stat(`live · ${net.curSnap.size} agents · ${String(msg.hour).padStart(2,'0')}:${String(msg.minute).padStart(2,'0')} · ${msg.weather}`);
}

const net = createNet({
  onSnapshot,
  onDetail: (d) => observer.inspector.renderDetail(d),
  onBuilding: (b) => observer.inspector.renderBuilding(b),
  onStatus: (s) => stat(s),
  onOpen: () => observer.onOpen(),
});
const engine = createEngine({ net });
const observer = createObserver({ net, engine });   // owns camera + cam controls; mounts hud + inspector

async function init() {
  stat('fetching town layout…');
  // no-store: these aggregate payloads change as the renderer evolves; the
  // per-asset model/texture/atlas endpoints stay cacheable (immutable).
  const data = await (await fetch('/asset/town', { cache: 'no-store' })).json();
  const climate = data.climateBase, season = data.season;
  setTownClimateSeason(climate, season);   // used by streamed region structures

  // Terrain. Region mode streams per-pixel tiles around the camera (the static
  // /asset/terrain payload is empty there); town mode ships its pixel + 3x3
  // neighbours up front so buildings visibly sit on the ground.
  try {
    const meta = await (await fetch('/asset/regionmeta', { cache: 'no-store' })).json();
    if (meta.isRegion) {
      setRegionMeta(meta);                   // streamRegionTerrain() takes over
      gfx.fogFar = 3200;                     // region scale: see a few tiles out
    } else {
      const terrainTiles = await (await fetch('/asset/terrain', { cache: 'no-store' })).json();
      buildTerrain(terrainTiles);
      observer.hud.positionTerrain();        // apply the 'show terrain' toggle to the new tiles
    }
  } catch (e) { console.warn('terrain load failed', e); }
  observer.hud.setFogSlider();   // seed the fog slider with the chosen town/region distance

  stat(`loading ${data.modelIds.length} unique models…`);

  const protos = new Map();
  let loaded = 0;
  await Promise.all(data.modelIds.map(async id => {
    protos.set(id, await loadModel(id, climate, season));
    stat(`loading models ${++loaded}/${data.modelIds.length}…`);
  }));

  if (protos.has(446) && !protos.has(447))
    protos.set(447, await loadModel(447, climate, season));

  let placed = 0;
  const gates = [];
  for (const p of data.placements) {
    const proto = protos.get(p.modelId);
    if (!proto) continue;
    const inst = proto.clone();
    inst.applyMatrix4(new THREE.Matrix4().fromArray(p.matrix));
    town.add(inst);
    placed++;
    if (p.modelId === 446 || p.modelId === 447) {
      const closed = protos.get(447).clone();
      closed.applyMatrix4(new THREE.Matrix4().fromArray(p.matrix));
      closed.visible = false;
      town.add(closed);
      inst.userData.isGateOpen = true;
      gates.push({ open: inst, closed });
    }
  }
  setGatePairs(gates);

  // World flats: static billboards for nature + decorative sprites.
  flats = new THREE.Group();
  scene.add(flats);
  // Group flats by archive so each atlas is fetched once.
  const byArchive = new Map();
  for (const f of (data.flats || [])) {
    if (!byArchive.has(f.archive)) byArchive.set(f.archive, []);
    byArchive.get(f.archive).push(f);
  }
  for (const [archive, list] of byArchive) {
    getFlatSheet(archive).then(({ meta, tex }) => {
      flats.add(buildFlatInstances(meta, tex, list));
    });
  }

  observer.hud.applyToggles();
  if (getRegionMeta()) observer.frameRegion(); else observer.frameTown(data.min, data.max);

  const climates = ['Desert', 'Mountain', 'Temperate', 'Swamp'];
  stat(`${data.region} · ${data.location}\nclimate: ${climates[climate] ?? climate}\nplacements: ${placed}/${data.placements.length}\nunique models: ${data.modelIds.length}\nconnecting agents…`);

  // Live agents: all sprite pools by render-kind, then the snapshot stream.
  setSpritePools(await (await fetch('/asset/spritepools')).json());
  net.connect();
}
init().catch(e => { stat('error: ' + (e?.message || e)); console.error(e); });
observer.start();   // start the render loop after all declarations are initialised
</script>
</body>
</html>
